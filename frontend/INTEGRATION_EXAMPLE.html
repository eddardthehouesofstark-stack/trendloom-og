<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Example - TrendLoom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">TrendLoom API Integration Example</h1>
        
        <!-- KPIs Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Live KPIs</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="text-center">
                    <p class="text-gray-600 text-sm">Market Coverage</p>
                    <p class="text-3xl font-bold text-blue-600" data-kpi="market-coverage">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-600 text-sm">Trend Accuracy</p>
                    <p class="text-3xl font-bold text-green-600" data-kpi="trend-accuracy">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-600 text-sm">Signal Strength</p>
                    <p class="text-2xl font-bold text-purple-600" data-kpi="signal-strength">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-600 text-sm">Active Signals</p>
                    <p class="text-3xl font-bold text-orange-600" data-kpi="active-signals">--</p>
                </div>
            </div>
        </section>

        <!-- Trending Products -->
        <section class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Trending Products</h2>
            <div id="products-container" class="grid grid-cols-3 gap-4">
                <p class="col-span-3 text-center py-8 text-gray-500">Loading products...</p>
            </div>
        </section>

        <!-- Search Example -->
        <section class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Product Search</h2>
            <input 
                id="search-input" 
                type="text" 
                placeholder="Search products..." 
                class="w-full p-3 border rounded-lg mb-4"
            >
            <div id="search-results" class="space-y-2">
                <p class="text-gray-500 text-sm">Type to search...</p>
            </div>
        </section>

        <!-- API Status -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">API Status</h2>
            <div id="api-status" class="space-y-2">
                <p class="text-gray-500">Checking backend connection...</p>
            </div>
        </section>
    </div>

    <!-- API Client -->
    <script src="js/api.js"></script>
    
    <!-- Page Logic -->
    <script>
        // Load dashboard data
        async function loadDashboard() {
            try {
                console.log('Loading dashboard...');
                
                const data = await TrendLoomAPI.getDashboard();
                
                // Update KPIs
                document.querySelector('[data-kpi="market-coverage"]').textContent = `${data.market_coverage}%`;
                document.querySelector('[data-kpi="trend-accuracy"]').textContent = `${data.trend_accuracy}%`;
                document.querySelector('[data-kpi="signal-strength"]').textContent = data.signal_strength;
                document.querySelector('[data-kpi="active-signals"]').textContent = data.active_signals;
                
                // Display trending products
                displayProducts(data.trending_products);
                
                // Update API status
                document.getElementById('api-status').innerHTML = `
                    <p class="text-green-600 font-semibold">✓ Backend Connected</p>
                    <p class="text-sm text-gray-600">Data loaded successfully from ${data.state}</p>
                    <p class="text-xs text-gray-500">Last updated: ${new Date(data.last_updated).toLocaleString()}</p>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('api-status').innerHTML = `
                    <p class="text-red-600 font-semibold">✗ Connection Failed</p>
                    <p class="text-sm text-gray-600">${error.message}</p>
                    <p class="text-xs text-gray-500 mt-2">Make sure backend is running on http://localhost:8000</p>
                `;
            }
        }

        // Display products
        function displayProducts(products) {
            const container = document.getElementById('products-container');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<p class="col-span-3 text-center py-8 text-gray-500">No products found</p>';
                return;
            }
            
            container.innerHTML = products.slice(0, 6).map(product => `
                <div class="border rounded-lg p-4 hover:shadow-lg transition">
                    <img src="${product.image_url || 'https://via.placeholder.com/200'}" 
                         alt="${product.name}" 
                         class="w-full h-40 object-cover rounded mb-2">
                    <h3 class="font-semibold text-sm mb-1 truncate">${product.name}</h3>
                    <p class="text-xs text-gray-600 mb-2">${product.category}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold text-blue-600">${product.trend_score.toFixed(1)}</span>
                        <span class="text-xs px-2 py-1 bg-green-100 text-green-800 rounded">
                            ${product.weekly_growth > 0 ? '+' : ''}${product.weekly_growth.toFixed(1)}%
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Setup search
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const resultsContainer = document.getElementById('search-results');
            
            const debouncedSearch = ApiUtils.debounce(async (query) => {
                if (query.length < 2) {
                    resultsContainer.innerHTML = '<p class="text-gray-500 text-sm">Type at least 2 characters...</p>';
                    return;
                }
                
                resultsContainer.innerHTML = '<p class="text-gray-500 text-sm">Searching...</p>';
                
                try {
                    const results = await TrendLoomAPI.searchProducts({ query, limit: 5 });
                    
                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<p class="text-gray-500 text-sm">No results found</p>';
                        return;
                    }
                    
                    resultsContainer.innerHTML = results.map(product => `
                        <div class="p-3 border rounded hover:bg-gray-50 cursor-pointer">
                            <p class="font-semibold">${product.name}</p>
                            <p class="text-sm text-gray-600">${product.category} - Score: ${product.trend_score.toFixed(1)}</p>
                        </div>
                    `).join('');
                    
                } catch (error) {
                    resultsContainer.innerHTML = `<p class="text-red-500 text-sm">Search failed: ${error.message}</p>`;
                }
            }, 300);
            
            searchInput.addEventListener('input', (e) => {
                debouncedSearch(e.target.value);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            setupSearch();
        });
    </script>
</body>
</html>
