services:
  - type: web
    name: trendloom-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./trendloom.db
      - key: SCHEDULER_ENABLED
        value: "False"
      - key: DEBUG
        value: "False"
