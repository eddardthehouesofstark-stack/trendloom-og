version: '3.8'

services:
  backend:
    build: .
    container_name: trendloom-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./trendloom.db:/app/trendloom.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./trendloom.db
      - REDIS_ENABLED=false
      - SCHEDULER_ENABLED=true
    restart: unless-stopped
    networks:
      - trendloom

  # Optional: Uncomment to add Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: trendloom-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - trendloom
  #   restart: unless-stopped

  # Optional: Uncomment to add PostgreSQL
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: trendloom-postgres
  #   environment:
  #     - POSTGRES_USER=trendloom
  #     - POSTGRES_PASSWORD=trendloom123
  #     - POSTGRES_DB=trendloom
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - trendloom
  #   restart: unless-stopped

networks:
  trendloom:
    driver: bridge

